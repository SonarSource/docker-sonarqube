---
name: Notify Slack on Failure
on:
  workflow_call:
    inputs:
      message:
        type: string
        required: false
        default: ''
      title:
        type: string
        required: false
        default: Build Failed
      color:
        type: string
        required: false
        default: danger
      channel:
        type: string
        required: false
        default: squad-sq-platform-build-notification

jobs:
  slack-notifications:
    name: Slack Notification
    permissions:
      id-token: write
    runs-on: github-ubuntu-latest-s
    steps:
      - name: Vault Secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/slack token | SLACK_TOKEN;
      - name: Send Slack Notification
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        env:
          SLACK_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).SLACK_TOKEN }}
          SLACK_CHANNEL: ${{ inputs.channel }}
          SLACK_TITLE: ${{ inputs.title }}
          SLACK_MESSAGE: |-
            ${{ inputs.message || format('Workflow failed in {0} 🚨
            {1}/{0}/actions/runs/{2}
            Branch: {3}
            Commit: {4}
            ', github.repository, github.server_url, github.run_id, github.ref_name, github.sha) }}
          SLACK_USERNAME: BuildBot
          SLACK_COLOR: ${{ inputs.color }}

