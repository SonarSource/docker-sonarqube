name: CI Nightly Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2AM UTC

permissions:
  contents: read

jobs:
  load-branches:
    runs-on: github-ubuntu-latest-s
    outputs:
      branches: ${{ steps.branches.outputs.branches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Load supported branches
        id: branches
        run: |
          branches=$(jq -ce '.supported_branches | select(type == "array" and length > 0) | select(all(.[]; type == "string" and length > 0)) | unique' .github/supported_branches.json)
          echo "branches=$branches" >> "$GITHUB_OUTPUT"

  dispatch-ci:
    name: Dispatch nightly CI (${{ matrix.branch }})
    needs: load-branches
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.load-branches.outputs.branches) }}
    steps:
      - name: Get nightly trigger token
        id: secrets
        uses: SonarSource/vault-action-wrapper@20728776e291b4027acb3618091a31fa15c61a30 # v3
        with:
          secrets: |
            development/github/token/{REPO_OWNER_NAME_DASH}-nightly-trigger token | TRIGGER_GITHUB_TOKEN;
      - name: Start branch CI
        env:
          GH_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).TRIGGER_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ matrix.branch }}
        run: gh workflow run push_and_pr.yml --ref "$TARGET_BRANCH" -f nightly=true
