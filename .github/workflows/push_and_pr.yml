name: CI - Build and Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/heads/release/') }}

on:
  push:
    branches:
      - master
      - 'release/**'
    paths:
      - 'commercial-editions/**/*'
      - 'community-build/*'
      - '.github/workflows/scripts/**'
      - '.github/workflows/push_and_pr.yml'
      - '.github/workflows/multi-arch-build-template.yml'
      - '.github/workflows/multi-arch-test-template.yml'
      - '.github/workflows/gcp-build-template.yml'
      - '.github/github_env.yaml'
      - '.github/trivy.yaml'
      - '.trivyignore.yaml'
      - 'run-tests.sh'
      - 'docker-official-images/**/*'
  # No paths filter: release branches require QA Validator, which a skipped workflow never reports.
  # The changes job below decides instead whether a pull request has an image to build.
  pull_request:
  workflow_call:
    inputs:
      run_builds:
        description: 'Run build jobs'
        required: false
        default: true
        type: boolean
      run_tests:
        description: 'Run test jobs'
        required: false
        default: true
        type: boolean
      run_go_tests:
        description: 'Run Go tests'
        required: false
        default: true
        type: boolean
      run_gcp_staging:
        description: 'Run GCP staging builds (force on any branch)'
        required: false
        default: false
        type: boolean
      editions:
        description: 'Which editions to build/test'
        required: false
        default: 'all'
        type: string
  workflow_dispatch:
    inputs:
      run_builds:
        description: 'Run build jobs'
        required: false
        default: true
        type: boolean
      run_tests:
        description: 'Run test jobs'
        required: false
        default: true
        type: boolean
      run_go_tests:
        description: 'Run Go tests'
        required: false
        default: true
        type: boolean
      run_gcp_staging:
        description: 'Run GCP staging builds (force on any branch)'
        required: false
        default: false
        type: boolean
      editions:
        description: 'Which editions to build/test'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - commercial-only
          - community-only

jobs:
  # Pull requests touching none of these paths skip every build, test and scan job, and QA Validator
  # still reports. Other events always build: push has its own paths filter (keep both lists in sync).
  changes:
    name: Detect image changes
    runs-on: github-ubuntu-latest-s
    permissions:
      contents: read
    outputs:
      images: ${{ steps.filter.outputs.images }}
    steps:
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The pull request merge commit and its first parent, the base branch.
          fetch-depth: 2

      - id: filter
        name: Check changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "${EVENT_NAME}" != 'pull_request' ]]; then
            echo "images=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Glob pathspecs match like GitHub path filters: "*" stops at "/", "**" doesn't.
          paths=(
            'commercial-editions/**/*'
            'community-build/*'
            '.github/workflows/scripts/**'
            '.github/workflows/push_and_pr.yml'
            '.github/workflows/multi-arch-build-template.yml'
            '.github/workflows/multi-arch-test-template.yml'
            '.github/workflows/gcp-build-template.yml'
            '.github/github_env.yaml'
            '.github/trivy.yaml'
            '.trivyignore.yaml'
            'run-tests.sh'
            'docker-official-images/**/*'
          )
          changed=$(git diff --name-only HEAD^1 HEAD -- "${paths[@]/#/:(glob)}")
          if [[ -n "${changed}" ]]; then
            echo "Image paths changed:"
            echo "${changed}"
            echo "images=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image path changed: skipping the build, test and scan jobs."
            echo "images=false" >> "$GITHUB_OUTPUT"
          fi

  load-config:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    uses: ./.github/workflows/load-config.yml

  # Build phase - all editions in parallel
  build-commercial-editions:
    needs: load-config
    if: |
      (github.event_name != 'workflow_dispatch' || inputs.run_builds) &&
      (github.event_name != 'workflow_dispatch' || inputs.editions == 'all' || inputs.editions == 'commercial-only')
    name: Build commercial edition (${{ matrix.edition }})
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/multi-arch-build-template.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: commercial-editions/developer
            edition: developer
          - version: commercial-editions/enterprise
            edition: enterprise
          - version: commercial-editions/datacenter/app
            edition: datacenter-app
          - version: commercial-editions/datacenter/search
            edition: datacenter-search
    with:
      staging_image_name: ${{ needs.load-config.outputs.staging_image }}
      tag: ${{ needs.load-config.outputs.current_version }}-master-${{ matrix.edition }}
      version: ${{ matrix.version }}
      runs_on: github-ubuntu-latest-s

  build-community-build:
    needs: load-config
    if: |
      (github.event_name != 'workflow_dispatch' || inputs.run_builds) &&
      (github.event_name != 'workflow_dispatch' || inputs.editions == 'all' || inputs.editions == 'community-only')
    name: Build community edition
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/multi-arch-build-template.yml
    with:
      staging_image_name: ${{ needs.load-config.outputs.staging_image }}
      tag: ${{ needs.load-config.outputs.community_build_version }}-master-community
      version: community-build
      runs_on: github-ubuntu-latest-s

  # Test phase - runs immediately after builds complete (no workflow_run delay)
  test-commercial-editions:
    needs: [changes, load-config, build-commercial-editions]
    # always() below drops the implicit success() check, so gate on changes explicitly.
    if: |
      needs.changes.outputs.images == 'true' &&
      (github.event_name != 'workflow_dispatch' || (always() && inputs.run_tests)) &&
      (github.event_name != 'workflow_dispatch' || (always() && (inputs.editions == 'all' || inputs.editions == 'commercial-only')))
    name: Test commercial edition (${{ matrix.test_name }}, ${{ matrix.architecture }})
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/multi-arch-test-template.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_name: docker
            edition: developer
            architecture: amd64
          - test_name: docker
            edition: developer
            architecture: arm64
          - test_name: docker
            edition: enterprise
            architecture: amd64
          - test_name: docker
            edition: enterprise
            architecture: arm64
          - test_name: docker-compose
            edition: datacenter
            architecture: amd64
          - test_name: docker-compose
            edition: datacenter
            architecture: arm64
    with:
      staging_image_name: ${{ needs.load-config.outputs.staging_image }}
      tag: ${{ needs.load-config.outputs.current_version }}-master-${{ matrix.edition }}
      test_name: ${{ matrix.test_name }}
      architecture: ${{ matrix.architecture }}
      runs_on: ${{ matrix.architecture == 'arm64' && 'github-ubuntu-24.04-arm-s' || 'github-ubuntu-latest-s' }}

  test-community-build:
    needs: [changes, load-config, build-community-build]
    if: |
      needs.changes.outputs.images == 'true' &&
      (github.event_name != 'workflow_dispatch' || (always() && inputs.run_tests)) &&
      (github.event_name != 'workflow_dispatch' || (always() && (inputs.editions == 'all' || inputs.editions == 'community-only')))
    name: Test community edition (${{ matrix.architecture }})
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/multi-arch-test-template.yml
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    with:
      staging_image_name: ${{ needs.load-config.outputs.staging_image }}
      tag: ${{ needs.load-config.outputs.community_build_version }}-master-community
      test_name: docker
      architecture: ${{ matrix.architecture }}
      runs_on: ${{ matrix.architecture == 'arm64' && 'github-ubuntu-24.04-arm-s' || 'github-ubuntu-latest-s' }}

  # Unit tests for the Trivy CVSS policy evaluator itself (SONAR-31880). Independent of
  # the build/scan jobs below -- it only needs the script and its test fixtures, not a
  # built image -- so it can run immediately without waiting on load-config.
  test-trivy-policy-script:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    name: Test Trivy CVSS policy script
    runs-on: github-ubuntu-latest-s
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest

      - name: Run policy evaluator tests
        run: python3 -m pytest .github/workflows/scripts/tests -v

  # Security scanning - runs after builds complete. Mirrors the
  # build-commercial-editions / build-community-build split so every staging image
  # (developer, enterprise, datacenter-app, datacenter-search, community) is scanned.
  trivy-scan-commercial-editions:
    needs: [changes, load-config, build-commercial-editions]
    if: |
      always() && needs.changes.outputs.images == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.editions == 'all' || inputs.editions == 'commercial-only')
    name: Security Scan (${{ matrix.edition }})
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        edition: [developer, enterprise, datacenter-app, datacenter-search]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: secrets
        name: Retrieve secrets from Vault
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/docker/sonardockerrw username | docker_username;
            development/kv/data/docker/sonardockerrw access_token_rwd | docker_password;

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ fromJSON(steps.secrets.outputs.vault).docker_username }}
          password: ${{ fromJSON(steps.secrets.outputs.vault).docker_password }}

      - name: Pull staging image
        run: |
          docker pull ${{ needs.load-config.outputs.staging_image }}:${{ needs.load-config.outputs.current_version }}-master-${{ matrix.edition }}

      # Two invocations produce JSON (for the CVSS policy evaluator) and SARIF (for the
      # Security tab). --config/--ignorefile/--ignore-unfixed/--show-suppressed are kept
      # identical across both; only format and output differ.
      - name: Run Trivy vulnerability scanner (JSON, for policy evaluation)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Trivy severity is not the enforcement gate: scan every severity band,
          # including UNKNOWN, so the evaluator sees every finding and judges it by CVSS.
          TRIVY_SEVERITY: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          # show-suppressed has no dedicated action input; set it via env instead.
          TRIVY_SHOW_SUPPRESSED: 'true'
        with:
          image-ref: '${{ needs.load-config.outputs.staging_image }}:${{ needs.load-config.outputs.current_version }}-master-${{ matrix.edition }}'
          format: 'json'
          output: 'trivy-${{ matrix.edition }}.json'
          vuln-type: 'os'
          trivy-config: '.github/trivy.yaml'
          trivyignores: './.trivyignore.yaml'
          ignore-unfixed: true

      - name: Run Trivy vulnerability scanner (SARIF, for GitHub Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Keep the same severity scope as JSON, including UNKNOWN.
          # limit-severities-for-sarif prevents the action from unsetting this value.
          TRIVY_SEVERITY: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          TRIVY_SHOW_SUPPRESSED: 'true'
        with:
          image-ref: '${{ needs.load-config.outputs.staging_image }}:${{ needs.load-config.outputs.current_version }}-master-${{ matrix.edition }}'
          format: 'sarif'
          limit-severities-for-sarif: true
          output: 'trivy-${{ matrix.edition }}.sarif'
          vuln-type: 'os'
          trivy-config: '.github/trivy.yaml'
          trivyignores: './.trivyignore.yaml'
          ignore-unfixed: true

      - name: Evaluate Trivy report against CVSS policy
        if: ${{ !cancelled() && hashFiles(format('trivy-{0}.json', matrix.edition)) != '' }}
        run: python3 .github/workflows/scripts/evaluate-trivy-report.py trivy-${{ matrix.edition }}.json --summary-output trivy-${{ matrix.edition }}-summary.json

      - name: Verify Trivy report files
        if: ${{ !cancelled() }}
        env:
          REPORT_PREFIX: trivy-${{ matrix.edition }}
        run: |
          missing=0
          for suffix in .json .sarif -summary.json; do
            if [[ ! -s "${REPORT_PREFIX}${suffix}" ]]; then
              echo "::error::Missing or empty Trivy report: ${REPORT_PREFIX}${suffix}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Retain Trivy reports and summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.edition }}-attempt-${{ github.run_attempt }}
          path: |
            trivy-${{ matrix.edition }}.json
            trivy-${{ matrix.edition }}.sarif
            trivy-${{ matrix.edition }}-summary.json
          if-no-files-found: error

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@5e7a52feb2a3dfb87f88be2af33b9e2275f48de6 # v4.32.4
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.edition }}.sarif'
          category: 'image-${{ matrix.edition }}'

  trivy-scan-community-build:
    needs: [changes, load-config, build-community-build]
    if: |
      always() && needs.changes.outputs.images == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.editions == 'all' || inputs.editions == 'community-only')
    name: Security Scan (community)
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: secrets
        name: Retrieve secrets from Vault
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/docker/sonardockerrw username | docker_username;
            development/kv/data/docker/sonardockerrw access_token_rwd | docker_password;

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ fromJSON(steps.secrets.outputs.vault).docker_username }}
          password: ${{ fromJSON(steps.secrets.outputs.vault).docker_password }}

      - name: Pull staging image
        run: |
          docker pull ${{ needs.load-config.outputs.staging_image }}:${{ needs.load-config.outputs.community_build_version }}-master-community

      - name: Run Trivy vulnerability scanner (JSON, for policy evaluation)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SEVERITY: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          TRIVY_SHOW_SUPPRESSED: 'true'
        with:
          image-ref: '${{ needs.load-config.outputs.staging_image }}:${{ needs.load-config.outputs.community_build_version }}-master-community'
          format: 'json'
          output: 'trivy-community.json'
          vuln-type: 'os'
          trivy-config: '.github/trivy.yaml'
          trivyignores: './.trivyignore.yaml'
          ignore-unfixed: true

      - name: Run Trivy vulnerability scanner (SARIF, for GitHub Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Keep the same severity scope as JSON, including UNKNOWN.
          # limit-severities-for-sarif prevents the action from unsetting this value.
          TRIVY_SEVERITY: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          TRIVY_SHOW_SUPPRESSED: 'true'
        with:
          image-ref: '${{ needs.load-config.outputs.staging_image }}:${{ needs.load-config.outputs.community_build_version }}-master-community'
          format: 'sarif'
          limit-severities-for-sarif: true
          output: 'trivy-community.sarif'
          vuln-type: 'os'
          trivy-config: '.github/trivy.yaml'
          trivyignores: './.trivyignore.yaml'
          ignore-unfixed: true

      - name: Evaluate Trivy report against CVSS policy
        if: ${{ !cancelled() && hashFiles('trivy-community.json') != '' }}
        run: python3 .github/workflows/scripts/evaluate-trivy-report.py trivy-community.json --summary-output trivy-community-summary.json

      - name: Verify Trivy report files
        if: ${{ !cancelled() }}
        env:
          REPORT_PREFIX: trivy-community
        run: |
          missing=0
          for suffix in .json .sarif -summary.json; do
            if [[ ! -s "${REPORT_PREFIX}${suffix}" ]]; then
              echo "::error::Missing or empty Trivy report: ${REPORT_PREFIX}${suffix}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Retain Trivy reports and summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-community-attempt-${{ github.run_attempt }}
          path: |
            trivy-community.json
            trivy-community.sarif
            trivy-community-summary.json
          if-no-files-found: error

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@5e7a52feb2a3dfb87f88be2af33b9e2275f48de6 # v4.32.4
        if: always()
        with:
          sarif_file: 'trivy-community.sarif'
          category: 'image-community'

  # GCP staging builds - only on master or release branches, after tests pass
  gcp-build-staging-app:
    needs: [load-config, test-commercial-editions, test-community-build]
    if: |
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/')) ||
      (always() && github.event_name == 'workflow_dispatch' && inputs.run_gcp_staging)
    permissions:
      id-token: write
      contents: read
    name: GCP build staging (app)
    uses: ./.github/workflows/gcp-build-template.yml
    with:
      gcp_registry: ${{ needs.load-config.outputs.gcp_staging_registry }}
      gcp_product_name: ${{ needs.load-config.outputs.gcp_staging_product }}
      build_type: staging
      platforms: linux/amd64,linux/arm64
      extra_docker_build_args: "--provenance=false --annotation=manifest,manifest-descriptor:com.googleapis.cloudmarketplace.product.service.name=services/official-sonarqube-data-center-edition.endpoints.sonarsource-public.cloud.goog"
      current_version: ${{ needs.load-config.outputs.current_version }}
      component_type: app

  gcp-build-staging-search:
    needs: [load-config, test-commercial-editions, test-community-build]
    if: |
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/')) ||
      (always() && github.event_name == 'workflow_dispatch' && inputs.run_gcp_staging)
    permissions:
      id-token: write
      contents: read
    name: GCP build staging (search)
    uses: ./.github/workflows/gcp-build-template.yml
    with:
      gcp_registry: ${{ needs.load-config.outputs.gcp_staging_registry }}
      gcp_product_name: ${{ needs.load-config.outputs.gcp_staging_product }}
      build_type: staging
      platforms: linux/amd64,linux/arm64
      extra_docker_build_args: "--provenance=false --annotation=manifest,manifest-descriptor:com.googleapis.cloudmarketplace.product.service.name=services/official-sonarqube-data-center-edition.endpoints.sonarsource-public.cloud.goog"
      current_version: ${{ needs.load-config.outputs.current_version }}
      component_type: search

  qa-validator:
    if: always()
    name: QA Validator
    # changes must succeed (it is not an allowed skip): if it fails, QA Validator fails instead of
    # passing on a run where every other job was skipped.
    needs:
      - changes
      - load-config
      - test-trivy-policy-script
      - build-commercial-editions
      - build-community-build
      - test-commercial-editions
      - test-community-build
      - trivy-scan-commercial-editions
      - trivy-scan-community-build
      - gcp-build-staging-app
      - gcp-build-staging-search
    runs-on: github-ubuntu-latest-s
    outputs:
      SUCCESS: ${{ steps.alls-green.outputs.success == 'true' && steps.required-scans.outcome == 'success' }}
    steps:
      # alls-green allows intentional skips; reject skips for selected scans.
      - name: Require selected image scans
        id: required-scans
        env:
          COMMERCIAL_REQUIRED: ${{ needs.load-config.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.editions == 'all' || inputs.editions == 'commercial-only') }}
          COMMERCIAL_SCAN: ${{ needs.trivy-scan-commercial-editions.result }}
          COMMUNITY_REQUIRED: ${{ needs.load-config.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.editions == 'all' || inputs.editions == 'community-only') }}
          COMMUNITY_SCAN: ${{ needs.trivy-scan-community-build.result }}
        run: |
          if [[ "$COMMERCIAL_REQUIRED" == true && "$COMMERCIAL_SCAN" != success ]]; then
            echo "Commercial images require a successful security scan."
            exit 1
          fi
          if [[ "$COMMUNITY_REQUIRED" == true && "$COMMUNITY_SCAN" != success ]]; then
            echo "Community images require a successful security scan."
            exit 1
          fi
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        if: always()
        id: alls-green
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: 'load-config,test-trivy-policy-script,build-commercial-editions,build-community-build,test-commercial-editions,test-community-build,trivy-scan-commercial-editions,trivy-scan-community-build,gcp-build-staging-app,gcp-build-staging-search'

  notify-slack-on-failure:
    name: Notify on Failure
    needs: [ qa-validator ]
    if: >-
      always() &&
      (needs.qa-validator.result == 'failure') &&
      github.event_name != 'pull_request' &&
      github.event_name != 'pull_request_review' &&
      (github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref_name, 'release/'))
    permissions:
      id-token: write
    uses: ./.github/workflows/slack_notify.yml
