  - id: CVE-2025-59375
    statement: >-
      Owner: hatem.amairi@sonarsource.com. Justification: Ubuntu 24.04 base-image
      (eclipse-temurin:25-jdk-noble) expat OS package vulnerability (libexpat1 2.6.1-2ubuntu0.4
      -> 2.6.1-2ubuntu0.5). Large dynamic memory allocations triggered by a small crafted
      document, causing a denial of service for the calling process. libexpat1 is only pulled in
      by the base image's libfontconfig1, which uses it to parse fontconfig's own XML
      configuration (root-owned /etc/fonts, not writable by the sonarqube user). SonarQube's JVM
      parses XML with Java's own parsers and never passes request-controlled XML to expat, so
      this code path is not reachable from our attack surface. No newer upstream base image
      build available as of 2026-09-25; apt-get upgrade was rejected as a fix since it breaks
      Docker Official Images build reproducibility (these Dockerfiles are pinned per-commit in
      docker-official-images/internal/build/build.go). Tracked in SONAR-32543 -- plan is to pin
      the specific patched package version or pick up an upstream base image bump before this
      expires.
