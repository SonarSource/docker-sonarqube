      document, causing a denial of service for the calling process. libexpat1 is only pulled in
      by the base image's libfontconfig1, which uses it to parse fontconfig's own XML
      configuration (root-owned /etc/fonts, not writable by the sonarqube user). SonarQube's JVM
      parses XML with Java's own parsers and never passes request-controlled XML to expat, so
      this code path is not reachable from our attack surface. No newer upstream base image
      build available as of 2026-09-25; apt-get upgrade was rejected as a fix since it breaks
