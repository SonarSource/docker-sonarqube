  - id: CVE-2026-18374
    statement: >-
      Owner: carmine.vassallo@sonarsource.com. Justification: Ubuntu 24.04 base-image
      (eclipse-temurin:25-jdk-noble) glibc OS package vulnerability (USN-9065-1,
      libc6/libc-bin/locales 2.39-0ubuntu8.9 -> 2.39-0ubuntu8.12; the fix reached noble-security on
      2026-11-12, after the base images the published 2026.5.5 images were built from). Heap buffer
      overflow in fopen when the ,ccs= part of the mode string is attacker controlled. Across the
      whole filesystem of our images, including the native libraries packaged inside the SonarQube
      and Elasticsearch jars, only glibc itself (libc.so.6 and ldconfig) contains the ,ccs= syntax,
      so no program in the image passes such a mode string to fopen, let alone one an attacker
      controls. This is not reachable from our attack surface. Tracked in SONAR-33427 and
      SONAR-31880.
    expired_at: 2026-12-12
