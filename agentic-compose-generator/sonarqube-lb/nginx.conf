# Copied into the bundle by generate.py for --edition datacenter and bind-mounted read-only over
# /etc/nginx/conf.d/default.conf. Load-balances the SonarQube application nodes; listens on 9000 so
# it is addressed exactly like a single-node SonarQube (`sonarqube:9000`).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

upstream sonarqube_app {
  # Resolved once at startup: after recreating an application node, `docker compose restart sonarqube`.
  server sonarqube-app-1:9000 max_fails=3 fail_timeout=30s;
  server sonarqube-app-2:9000 max_fails=3 fail_timeout=30s;
}

server {
  listen 9000;
  server_name _;

  # Analysis reports run to tens of megabytes; nginx's 1 MB default would reject them with a 413.
  client_max_body_size 0;

  location / {
    proxy_pass http://sonarqube_app;
    proxy_http_version 1.1;

    # X-Forwarded-Proto/-Host/-Port are deliberately not set: nginx passes the ones tls-proxy
    # sets (when it is in front) through unchanged, so SonarQube still sees the https origin.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Upgrade           $http_upgrade;

    # SSE (/api/push/sonarlint_events) and long compute-engine polls hold responses open.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
